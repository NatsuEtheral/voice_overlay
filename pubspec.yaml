name: offline_voice_notes
description: "A fast, privacy-first offline voice notes app powered by on-device Whisper STT and Piper/Native TTS."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Local Database & Storage
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0

  # Audio Recording & Playback
  record: ^7.1.2
  audioplayers: ^6.0.0

  # Speech & AI Engines
  sherpa_onnx: ^1.10.37
  flutter_tts: ^4.0.2

  # Networking for Model Downloader
  dio: ^5.4.3+1
  archive: ^3.6.1

  # High Refresh Rate (120Hz) Support on Android
  flutter_displaymode: ^0.7.0

  # UI & Animations
  intl: ^0.19.0
  uuid: ^4.4.0
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
